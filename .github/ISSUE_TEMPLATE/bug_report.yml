name: Bug report
description: Report a reproducible problem in YouTube Study Lab
title: "bug: "
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and Discussions for this problem.
          required: true
        - label: I removed API keys, tokens, and private transcript content from this report.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start the app with ...
        2. Paste ...
        3. Click ...
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Generation mode
      options:
        - Local heuristic
        - OpenAI
        - Azure OpenAI
        - Gemini
        - Not sure
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: OS, Python version, and browser
      placeholder: Ubuntu 24.04, Python 3.12, Firefox 128
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant logs
      description: Paste only sanitized logs. Never include API keys or tokens.
      render: shell
