<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Study Lab architecture</title>
  <desc id="desc">A YouTube URL or pasted transcript flows through transcript retrieval or normalization, local or API-based study pack generation, and produces summary, notes, quiz, classification, transcript, and Markdown export.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)" opacity=".8"/>

  <circle cx="46" cy="45" r="7" fill="#f97316"/>
  <text x="65" y="53" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">YouTube Study Lab</text>
  <text x="65" y="79" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">From a captioned video or pasted transcript to an active-recall study pack</text>

  <!-- arrows behind components -->
  <path d="M235 265H315" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M575 265H655" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M915 265H985" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="45" y="185" width="190" height="160" rx="16" fill="#0f172a"/>
    <rect x="45" y="185" width="190" height="160" rx="16" fill="rgba(30,41,59,.55)" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="140" y="225" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Study source</text>
  <text x="140" y="257" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="13">YouTube or pasted text</text>
  <rect x="74" y="281" width="132" height="34" rx="17" fill="#1e293b" stroke="#475569"/>
  <text x="140" y="303" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="12">Instant demo included</text>

  <!-- transcript -->
  <g filter="url(#shadow)">
    <rect x="315" y="145" width="260" height="240" rx="16" fill="#0f172a"/>
    <rect x="315" y="145" width="260" height="240" rx="16" fill="rgba(8,51,68,.38)" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <text x="445" y="188" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Transcript layer</text>
  <text x="445" y="218" text-anchor="middle" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="12">FETCH • SELECT • NORMALIZE</text>
  <text x="445" y="237" text-anchor="middle" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="11">Pasted text bypasses retrieval</text>
  <rect x="346" y="245" width="198" height="42" rx="8" fill="#0f172a" stroke="#164e63"/>
  <text x="445" y="271" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="13">YouTube Transcript API</text>
  <text x="445" y="311" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">automatic fallback</text>
  <rect x="346" y="325" width="198" height="36" rx="8" fill="#0f172a" stroke="#164e63"/>
  <text x="445" y="348" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="13">yt-dlp caption tracks</text>

  <!-- generator -->
  <g filter="url(#shadow)">
    <rect x="655" y="145" width="260" height="240" rx="16" fill="#0f172a"/>
    <rect x="655" y="145" width="260" height="240" rx="16" fill="rgba(6,78,59,.35)" stroke="#34d399" stroke-width="2"/>
  </g>
  <text x="785" y="188" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Study pack engine</text>
  <text x="785" y="218" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="12">CHUNK • GENERATE • MERGE</text>
  <rect x="686" y="245" width="198" height="42" rx="8" fill="#0f172a" stroke="#065f46"/>
  <text x="785" y="271" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="13">No-key local heuristic</text>
  <text x="785" y="311" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="12">optional providers</text>
  <rect x="686" y="325" width="198" height="36" rx="8" fill="#0f172a" stroke="#065f46"/>
  <text x="785" y="348" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="13">OpenAI • Azure • Gemini</text>

  <!-- outputs -->
  <g filter="url(#shadow)">
    <rect x="985" y="145" width="170" height="240" rx="16" fill="#0f172a"/>
    <rect x="985" y="145" width="170" height="240" rx="16" fill="rgba(76,29,149,.35)" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <text x="1070" y="188" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Study pack</text>
  <g fill="#ddd6fe" font-family="Inter,Arial,sans-serif" font-size="13">
    <text x="1012" y="228">✓ Structured summary</text>
    <text x="1012" y="258">✓ Revision notes</text>
    <text x="1012" y="288">✓ 18-question quiz</text>
    <text x="1012" y="318">✓ Classification</text>
    <text x="1012" y="348">✓ Markdown export</text>
  </g>

  <rect x="315" y="421" width="600" height="52" rx="12" fill="rgba(136,19,55,.25)" stroke="#fb7185" stroke-dasharray="6 5"/>
  <text x="615" y="443" text-anchor="middle" fill="#fda4af" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">CONFIGURATION BOUNDARY</text>
  <text x="615" y="461" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="12">Optional provider keys stay in .env and never enter the Streamlit UI</text>

  <text x="45" y="486" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="11">Python • Streamlit • pytest • GitHub Actions</text>
</svg>
